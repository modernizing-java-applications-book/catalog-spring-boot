spring.application.name=catalog
server.port=8080

# H2 in-memory datasource (H2 2.x compatible)
spring.datasource.url=jdbc:h2:mem:catalog;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Spring Cloud Kubernetes for local development
spring.cloud.kubernetes.enabled=false

# Actuator endpoints (Spring Boot 3 requires explicit exposure)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
